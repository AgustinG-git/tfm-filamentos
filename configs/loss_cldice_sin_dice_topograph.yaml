# Pérdida: 0,5·BCE + 0,5·clDice + α·Topograph
# α = 0.04: con el modelo entrenado, Topograph pesa como BCE+Dice
# (scripts/medir_topograph.py: topo/bce_dice ≈ 27). Fijo, sin ajustar.
# Topograph se activa a partir de la época 6 (calentamiento).
hereda: base.yaml
nombre: cldice-sin-dice-topograph
entrenamiento:
  perdida: bce_cldice_topo
  perdida_args:
    peso_bce: 0.5
    peso_dice: 0.0
    peso_cldice: 0.5
    iters: 10
    peso_topo: 0.04
    calentamiento: 5
