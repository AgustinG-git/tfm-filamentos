# Baseline: BCE + Dice, sin aumentos, umbral 0,5, sin filtro de área.
# Cada experimento hereda de aquí (hereda: base.yaml) y cambia
# solo lo que estudia. Lo que fija el contrato no va aquí.

nombre: base
semilla: 42
humo: false            # true = 2 épocas, 50 pares de train, sin registro

pre:
  etiquetas: por_anotacion     # cada anotación es un ejemplo
  aumentos: ninguno

modelo:
  arquitectura: unet
  encoder: resnet34
  pesos: imagenet

entrenamiento:
  perdida: bce_dice
  perdida_args:
    peso_bce: 0.5
    peso_dice: 0.5
  epocas: 30
  batch: 8
  lr: 3.0e-4
  weight_decay: 1.0e-4
  amp: true
  workers: 2

post:
  metodo: umbral_cc
  umbral: 0.5
  area_min_512: 0
  conectividad: 8
