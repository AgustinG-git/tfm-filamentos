[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filseg"
version = "0.1.0"
description = "Segmentación de filamentos solares (TFM, MULCIA, Universidad de Sevilla)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "pycocotools",
    "matplotlib",
    "pyyaml",
    "torch",
    "tqdm",
]

[project.optional-dependencies]
train = ["segmentation-models-pytorch", "opencv-python-headless"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
